<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6.3 - Animaciones</title>
    <style>
        h1 {
            position: relative;
            animation-name: animation;
            animation-duration: 4s;

        }
        @keyframes animation {
            0%   {color:red; left:0px; top:0px;}
            100% {color: yellow; left: 1900px; top: 0px;}
        }
    </style>
</head>
<body>
    <h1>p</h1>

    
</body>
</html>
