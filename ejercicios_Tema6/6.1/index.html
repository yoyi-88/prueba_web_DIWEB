<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reproductor de Audio Accesible</title>
    <style>
        .audio-container {
            padding: 20px;
            background-color: #f4f4f9;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            font-family: sans-serif;
        }

        .custom-audio {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            filter: sepia(20%) saturate(70%) hue-rotate(190deg) brightness(100%);
            /* El filtro permite cambiar ligeramente el color del reproductor nativo */
        }

        .custom-audio:focus {
            outline: 3px solid #007bff;
            /* Mejora la visibilidad para navegación por teclado */
        }
    </style>
</head>

<body>

    <section class="audio-container">
        <h2 id="audio-label">Reproductor de Música de Fondo</h2>

        <audio controls loop preload="metadata" class="custom-audio" aria-labelledby="audio-label">

            <source src="audio/gold.mp3" type="audio/mpeg">
            <source src="audio/gold.aac" type="audio/aac">
            <source src="audio/gold.wav" type="audio/wav">



            <p>Tu navegador no admite la reproducción de audio.
                Puedes <a href="audio/gold.mp3">descargar el archivo aquí</a>.
            </p>
        </audio>
    </section>

</body>

</html>
