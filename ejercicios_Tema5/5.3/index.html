<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparativa JPG vs SVG</title>
    <style>

        
        .zoom {
            width: 500%;
            height: auto;
        }

        .container { 
            width: 150px; 
        } 
    </style>
</head>
<body>

    <div>
        <h2>1. Imagen png (Pixelada al ampliar)</h2>
        <div class="container">
            <img src="pajaro.jpg" alt="JPG pequeño" class="zoom">
        </div>
    </div>


    <div>
        <h2>2. Imagen SVG (Nítida al ampliar)</h2>
        <div class="container">
            <img src="alien.svg" alt="svg alien">
        </div>
    </div>

</body>
</html>
